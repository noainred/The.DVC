name: ci

# PR·push 마다 테스트를 돌린다.
#
# 왜 필요한가: 릴리스 워크플로는 '빌드해서 올리는' 일만 하므로, 테스트가 깨진 채로 머지돼도
# 아무도 모른 채 릴리스까지 갈 수 있다. 특히 pyportal 의 파이썬 테스트는 지금까지 로컬에서만
# 돌았다 — CI 에 넣어야 다른 사람이 고칠 때도 회귀가 자동으로 걸린다.

on:
  # ⚠ push 는 main 만이다(v2.558). 예전에는 `branches: ['**']` 이라 **같은 커밋에 CI 가 두 번**
  # 돌았다 — 실측: run #1210(push, sha 7716ede) 와 #1211(pull_request, 같은 sha 7716ede).
  # concurrency 로는 못 막는다: push 는 group 이 `ci-refs/heads/<브랜치>`, PR 은
  # `ci-refs/pull/<n>/merge` 라 **서로 다른 그룹**이기 때문이다(그래서 둘 다 살아남았다).
  # 기능 브랜치는 pull_request 이벤트가 덮으므로 검증 공백은 없다.
  #   ⚠ 단, **PR 이 아직 없는 브랜치 push 는 CI 가 돌지 않는다.** 이 저장소는 모든 변경이 PR 을
  #     거치므로(CLAUDE.md 릴리스 절차) PR 을 여는 순간 검사된다. PR 없이 브랜치만 밀어 두고
  #     결과를 기다리지 말 것 — 그때는 `workflow_dispatch` 로 수동 실행한다.
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read
  # 'pyportal 변경 PR 의 ver.txt 갱신 확인' 스텝이 `gh api .../pulls/<n>/files` 로 PR 변경 목록을
  # 읽는다. contents 만 주면 그 호출이 403(Resource not accessible by integration)으로 죽어
  # **PR 실행이 항상 빨간불**이 되고, 정작 검사하려던 ver.txt 게이트는 한 번도 평가되지 않는다.
  # 읽기 전용이며 pull_request_target 을 쓰지 않으므로 포크 PR 에 비밀이 노출되지 않는다.
  pull-requests: read

concurrency:
  # 같은 PR 에 연속 push 하면 이전 실행은 취소한다(러너 낭비 방지).
  # ⚠ 이것만으로는 'push × pull_request 중복'을 막지 못한다 — 두 이벤트의 ref 가 달라 그룹이
  #   갈린다. 그 중복은 위 `on.push.branches: [main]` 이 막는다. 둘 다 필요하다.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server-and-web:
    timeout-minutes: 30 # v2.480: 기본 6시간 — 127.0.0.1 바인딩 멈춤 사례가 있어 러너 장기 점유 방지
    name: 서버 단위테스트 + 웹 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'

      - name: 의존성 설치
        run: |
          npm --prefix server ci --no-audit --no-fund
          npm --prefix web ci --no-audit --no-fund

      - name: 서버 단위테스트 (node:test)
        run: npm --prefix server test

      # v2.447(감사 I2): lint 가 CI 에 없어 eslint 경고 75건이 그대로 통과했다.
      # react-hooks/rules-of-hooks 는 error 라 화면 크래시(React #310)를 막는 게이트다 —
      # 경고는 통과시키되(--max-warnings 미지정) 에러는 반드시 실패시킨다.
      - name: 웹 린트 (eslint — 훅 규칙 게이트)
        run: npm --prefix web run lint

      - name: 웹 테스트 (vitest)
        run: npm --prefix web run test

      - name: 웹 빌드 (vite)
        run: npm --prefix web run build

      # v2.447(감사 I2): 의존성 취약점을 릴리스 전에 드러낸다. 운영 배포에 들어가는 것은
      # production 의존성이므로 --omit=dev 로 좁히고, high 이상만 실패시킨다(moderate 는 로그로).
      # 에어갭 배포라 즉시 조치가 어려운 경우가 있어 continue-on-error 로 '경고' 성격을 유지한다.
      # v2.447(감사 I1): 환경변수 문서를 코드에서 자동 생성한다 — 손으로 관리하면 다시 어긋난다.
      # 갱신을 잊었다고 릴리스를 막지는 않되(경고), 어긋난 사실은 로그에 드러낸다.
      - name: 문서 최신 여부 (docs/ENV.md · docs/CONFIG-FILES.md · docs/API.md)
        continue-on-error: true
        run: |
          node scripts/env-doc.mjs --check
          node scripts/config-doc.mjs --check
          node scripts/api-doc.mjs --check

      # v2.478: critical 은 CI 를 실패시킨다(자동 업그레이드 경로에 critical 의존성이 실리는 것을 차단).
      # high 이하는 정보성으로 출력만 한다 — 잔여 high(d3-color: 3d-force-graph·react-simple-maps 경유, 외부 입력
      # 도달 불가)·moderate(exceljs→uuid v4 만 사용) 는 수용된 항목이라 차단하면 매 PR 이 막힌다.
      - name: 의존성 취약점 점검 (npm audit — critical 차단)
        run: |
          echo '=== server (정보) ==='; npm --prefix server audit --omit=dev --audit-level=high || true
          echo '=== web (정보) ===';    npm --prefix web audit --omit=dev --audit-level=high || true
          echo '=== critical 차단 ===';
          npm --prefix server audit --omit=dev --audit-level=critical
          npm --prefix web audit --omit=dev --audit-level=critical

  pyportal:
    timeout-minutes: 20
    name: 서비스 허브 테스트 (Python)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 파이썬 레그를 이벤트에 따라 나눈다(v2.559) — PR 은 3.9 하나, main push·수동 실행은
        # 3.9 + 상위 버전.
        #
        # ⚠ **3.9 는 어느 쪽에서도 빼지 말 것.** pyportal/README.md:19 가 'Python 3.9+' 이고
        #   배포처가 Rocky Linux 9(= 3.9)다. 3.9 를 빼면 **실제로 돌아가는 버전을 한 번도 검사하지
        #   않는 CI** 가 되는데, 그래도 초록으로 뜨므로 아무도 모른다.
        #
        # 왜 상위 버전을 PR 에서 빼는가: 순전히 러너 분 절감이다. ci 실행은 9월 18일간 **644회**
        # 였고 그중 main push 는 **162회** 뿐이라, 상위 레그를 main 으로 좁히면 그 레그 비용이
        # 1/4 로 준다. 상위 버전 깨짐은 **머지 직전**에 잡히므로 '3.9+' 보장은 유지된다.
        #   · 지금 코드에 3.12 전용 문법(match/except*/ParamSpec/TypeAlias)은 0건이고, pyportal 은
        #     표준 라이브러리 전용이라(아래 '외부 의존성이 없는지 확인' 스텝이 강제) 표면이 작다.
        #   · ⚠ 상위 버전을 올릴 때(3.12 → 3.13 등)는 **두 배열 다**가 아니라 뒤 배열만 고친다.
        #   · ⚠ `A && B || C` 는 GitHub 식 삼항이다. B 가 빈 배열이면 falsy 로 접혀 C 가 되므로
        #     **두 배열 모두 비우지 말 것**(지금은 둘 다 최소 1개라 안전하다).
        #   ⚠ 한 줄로 둘 것. `>-` 폴딩은 **더 깊게 들여쓴 줄을 그대로 보존**하므로 식 안에
        #     줄바꿈이 남는다(v2.559 작성 중 실제로 그랬다).
        python-version: ${{ github.event_name == 'pull_request' && fromJSON('["3.9"]') || fromJSON('["3.9","3.12"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 외부 의존성이 없는지 확인
        # 표준 라이브러리 전용이 이 앱의 배포 전제다(오프라인 서버에 pip 불가) — 깨지면 즉시 실패.
        run: |
          if ls pyportal/requirements*.txt pyportal/pyproject.toml 2>/dev/null | grep -q .; then
            echo "::error::pyportal 은 표준 라이브러리 전용이어야 합니다(의존성 파일 발견)"; exit 1
          fi
          python3 -c "import sys; print('python', sys.version)"

      - name: 구문 검사(전 파일 컴파일)
        run: python3 -m compileall -q pyportal

      - name: pyportal 변경 PR 의 ver.txt 갱신 확인
        # ver.txt 는 pyportal 을 변경한 릴리스에서만 갱신하는 게 절차다(CLAUDE.md). 단위테스트로
        # '항상 일치'를 검사하면 pyportal 을 안 건드린 릴리스마다 오탐이라(v2.230~2.235 CI 상시 실패),
        # 진짜 불변조건 — pyportal 을 고친 PR 은 ver.txt 첫 줄 = package.json 버전 — 을
        # PR 변경 파일 목록으로만 검사한다. push 이벤트는 diff 기준점이 불확실해 검사하지 않는다
        # (모든 릴리스는 PR 을 거치므로 PR 게이트로 충분).
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')
          if echo "$files" | grep '^pyportal/' | grep -v '^pyportal/ver.txt$' | grep -q .; then
            top=$(head -n1 pyportal/ver.txt | awk '{print $1}')
            pkg=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
            if [ "$top" != "$pkg" ]; then
              echo "::error::pyportal 변경 PR 인데 ver.txt 갱신 누락 — ver.txt 첫 줄($top) ≠ package.json($pkg). pyportal/ver.txt 맨 위에 '$pkg (날짜) 한줄요약' 줄을 추가하세요."
              exit 1
            fi
            echo "ver.txt 동기화 확인: $top"
          else
            echo "pyportal 변경 없음 — ver.txt 검사 생략"
          fi

      - name: 단위·E2E 테스트
        working-directory: pyportal
        run: python3 -m unittest discover -s tests -v
