name: release

# 태그(v*) push 또는 수동 실행 시: 오프라인 설치 패키지(el9/cent9) + Windows 수집기 +
# 업그레이드 번들을 빌드해 '롤링' 릴리스(downloads)에 자산으로 업로드한다.
# 바이너리를 git 히스토리에 커밋하지 않으므로 .git 비대화가 사라지고, 빌드는 CI에서 수행된다.
#
# 포탈 자동 업그레이드는 PACKAGE_BASE_URL 을
#   https://github.com/<owner>/<repo>/releases/download/downloads
# 로 두면 ${base}/versions.json, ${base}/<파일> 이 이 릴리스 자산을 그대로 가리킨다.

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

# v2.480(3차 감사 B-4): 태그 push 와 workflow_dispatch 가 겹치면 두 러너가 각자 prev/versions.json 을 받아 prune·--clobber 해
# 한쪽 버전이 versions.json 에서 사라지거나 방금 올린 자산이 지워진다(자동 업그레이드 유실). 롤링 릴리스는 직렬로만.
concurrency:
  group: release-downloads
  cancel-in-progress: false

env:
  NODE_VERSION: '22.23.2'
  RELEASE_TAG: downloads

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies (root + server + web)
        run: npm run install:all

      - name: Unit tests
        run: npm test

      - name: Resolve version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build el9 installer + upgrade bundle
        run: bash packaging/offline/build-package.sh --node-version "$NODE_VERSION" --out dist-offline

      - name: Build cent9 installer
        run: STAMP=cent9-x64 bash packaging/offline/build-package.sh --node-version "$NODE_VERSION" --out dist-offline

      # 공급망 방어: nodejs.org 아카이브를 같은 버전 디렉터리의 공식 SHASUMS256.txt 로 대조한다.
      # 이 zip 은 그대로 Windows 수집기 패키지에 들어가므로, 변조/전송 손상된 런타임이 고객사에
      # 배포되면 안 된다. grep 미스(파일명 변경) 또는 해시 불일치면 pipefail/sha256sum 이 비0 종료
      # → 빌드 중단. 검증 후 다음 스텝이 기대하는 node-win.zip 경로로 rename 한다(스텝 계약 유지).
      - name: Fetch Windows Node runtime
        run: |
          set -euo pipefail
          zip="node-v${NODE_VERSION}-win-x64.zip"
          curl -fSL -o "$zip" "https://nodejs.org/dist/v${NODE_VERSION}/${zip}"
          curl -fSL -o SHASUMS256.txt "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt"
          grep -F "  ${zip}" SHASUMS256.txt > node-win.sha256
          cat node-win.sha256
          sha256sum -c node-win.sha256
          mv "$zip" node-win.zip

      - name: Build Windows collector package
        run: bash packaging/windows/build-collector-win.sh --node-zip node-win.zip --out dist-offline

      - name: Build UAG Monitor server(web) package
        run: bash packaging/uagmon/build-clients.sh --out dist-offline

      # 데스크톱 앱(Electron, 자체 창) — Windows 만 여기서(교차빌드 가능·서명 불필요).
      # macOS 앱은 Apple Silicon 이 서명 없는 실행 파일을 거부하므로 별도 macOS 러너 잡에서
      # 빌드해 ad-hoc 서명이 붙게 한다(uagmon-macos-app).
      - name: Build UAG Monitor desktop app (Windows)
        run: bash packaging/uagmon/build-desktop.sh --platforms "win32-x64" --out dist-offline

      - name: Generate sha256 sidecars
        run: |
          cd dist-offline
          for f in *.tar.gz *.zip; do sha256sum "$f" > "$f.sha256"; done
          ls -la

      - name: Fetch previous versions.json (if any)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          gh release download "$RELEASE_TAG" -p versions.json -D prev 2>/dev/null || true
          [ -f prev/versions.json ] || echo '{"latest":"","versions":[]}' > prev/versions.json

      - name: Build versions.json
        env:
          VERSIONS_KEEP: '15'
        run: node packaging/release/update-versions.mjs "${{ steps.ver.outputs.version }}" dist-offline prev/versions.json dist-offline/versions.json

      # 롤링 릴리스는 자산 1000개 상한이 있다. 오래된 버전 자산을 먼저 정리해 업로드 실패(422)를 막는다.
      # 유지 기준은 방금 만든 dist-offline/versions.json 의 버전 목록 — versions.json이 참조하는
      # 버전과 릴리스 자산을 정확히 일치시켜(고아/누락 없이) 자동 업그레이드를 안전하게 유지한다.
      - name: Prune old release assets (keep exactly versions.json's versions)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --json assets -q '.assets[].name' > all_assets.txt 2>/dev/null || true
          if [ -s all_assets.txt ]; then
            node packaging/release/prune-assets.mjs dist-offline/versions.json < all_assets.txt > to_delete.txt || true
            while IFS= read -r name; do
              [ -n "$name" ] && gh release delete-asset "$RELEASE_TAG" "$name" -y 2>/dev/null || true
            done < to_delete.txt
            echo "prune 완료: $(grep -c . to_delete.txt 2>/dev/null || echo 0) 자산 삭제"
          else
            echo "prune 생략: 기존 자산 없음"
          fi

      - name: Publish assets to rolling '${{ env.RELEASE_TAG }}' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --title "Downloads (rolling)" \
                 --notes "포탈 설치/업그레이드 자산. release 워크플로가 자동 갱신합니다." --latest=false

          # ⚠ 2026-09-13 실제 사고: `gh release upload dist-offline/* --clobber` 한 줄로 전부 올리면
          # **versions.json 하나의 실패가 패키지 게시까지 막는다**. 그날 clobber 가 기존 versions.json
          # 자산(asset id 560524226)을 지우는 단계에서 GitHub 이 HTTP 500 을 돌려줘 v2.502.0 패키지가
          # 한 개도 올라가지 못했다. 30분 간격 2회 연속 같은 지점에서 실패했고 3차에서 성공했다 —
          # 즉 **간헐적 서버 오류**이고, 재시도로 해소된다. 문제는 오류 자체가 아니라 그 한 건이
          # 나머지 15개 자산 업로드까지 취소시킨 구조였다.
          # 그래서 ① 패키지를 먼저 올리고 ② versions.json 은 재시도·명시적 삭제 폴백으로 따로 올린다.
          # 순서가 중요하다: versions.json 이 먼저 바뀌면 아직 없는 패키지를 가리키는 창이 생긴다.
          #
          # ⚠⚠ 2026-09-17 실제 사고(v2.550.3) — **v2.502 의 수정이 절반만 고친 것이었다**:
          #   그때 versions.json 에는 5회 재시도를 붙였는데 **패키지 업로드에는 재시도가 없었다**.
          #   같은 간헐적 500 이 이번에는 패키지 단계에서 났고 릴리스가 통째로 실패했다 —
          #     HTTP 500: Error creating asset temp dir (…name=vmware-portal-2.550.3.tar.gz)
          #   원인은 GitHub 업로드 엔드포인트의 일시 오류이고 재실행으로 해소된다(그날도 3차에서
          #   성공했다). 그러므로 **파일 단위로 재시도**한다 — 한 파일의 일시 오류가 나머지
          #   업로드를 취소시키지 않게 하는 것이 요점이다(v2.502 와 같은 교훈의 두 번째 적용).
          mapfile -t OTHERS < <(find dist-offline -maxdepth 1 -type f ! -name 'versions.json' | sort)
          if [ ${#OTHERS[@]} -gt 0 ]; then
            failed=()
            for f in "${OTHERS[@]}"; do
              up=0
              for i in 1 2 3 4; do
                if gh release upload "$RELEASE_TAG" "$f" --clobber; then up=1; break; fi
                echo "업로드 실패(시도 $i): $(basename "$f") — 기존 자산을 지우고 다시 시도합니다"
                gh release delete-asset "$RELEASE_TAG" "$(basename "$f")" -y || true
                sleep $((i * 10))
              done
              [ "$up" = 1 ] || failed+=("$(basename "$f")")
            done
            if [ ${#failed[@]} -gt 0 ]; then
              # ⚠ **조용히 넘어가지 않는다** — 패키지가 없으면 versions.json 이 없는 파일을 가리킨다.
              echo "::error::패키지 업로드 실패: ${failed[*]} — versions.json 을 갱신하지 않고 중단합니다(없는 파일을 가리키지 않게)."
              exit 1
            fi
            echo "패키지 업로드 완료: ${#OTHERS[@]}개"
          fi

          # versions.json = 자동 업그레이드의 진실의 원천. 여기서 실패하면 원격 업그레이드가
          # 이전 버전에 머무르므로 **조용히 넘어가지 않고** 재시도 후 명확히 실패시킨다.
          ok=0
          for i in 1 2 3 4 5; do
            if gh release upload "$RELEASE_TAG" dist-offline/versions.json --clobber; then ok=1; break; fi
            echo "versions.json 업로드 실패(시도 $i) — 기존 자산을 지우고 다시 시도합니다"
            gh release delete-asset "$RELEASE_TAG" versions.json -y || true
            sleep $((i * 15))
          done
          if [ "$ok" != 1 ]; then
            echo "::error::versions.json 갱신 실패 — 패키지는 올라갔지만 자동 업그레이드는 이전 버전에 머뭅니다."
            exit 1
          fi
          echo "업로드 완료: $(ls dist-offline | tr '\n' ' ')"

  # UAG Monitor macOS 데스크톱 앱 — macOS 러너에서 빌드해야 한다. Apple Silicon 은
  # 서명 없는 실행 파일의 실행을 거부하므로(리눅스 교차빌드 산출물은 서명이 없어 열리지
  # 않는다), macOS 에서 패키징해 ad-hoc 서명이 유지되게 한다. 배포 서명/공증은 하지 않으므로
  # 첫 실행은 우클릭→열기 승인이 필요하다(uagmon/README.md 안내).
  # 메인 잡의 prune 이 끝난 뒤 업로드해야 방금 올린 자산이 지워지지 않는다.
  uagmon-macos-app:
    needs: build-and-publish
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build macOS desktop apps (arm64 + x64)
        run: bash packaging/uagmon/build-desktop.sh --platforms "darwin-arm64 darwin-x64" --out dist-mac

      - name: Verify the packaged app launches (ad-hoc signature + embedded server)
        run: |
          set -euo pipefail
          mkdir -p check && tar -xzf dist-mac/uag-monitor-app-*-macos-arm64.tar.gz -C check
          APP="$(find check -maxdepth 2 -name '*.app' | head -1)"
          BIN="$APP/Contents/MacOS/UAG Monitor"
          codesign -dv "$APP" 2>&1 | grep -E 'Signature|flags' || true
          # GUI 창은 헤드리스 러너에서 띄울 수 없으므로, 앱에 동봉된 Electron 바이너리가
          # 내장 서버를 실제로 기동하는지(앱이 창에 붙이는 바로 그 경로)를 확인한다.
          ELECTRON_RUN_AS_NODE=1 "$BIN" "$APP/Contents/Resources/app/app/server.js" \
            --host 127.0.0.1 --port 0 --data "$PWD/check/data" > srv.log 2>&1 &
          for i in $(seq 1 20); do grep -q 'UAGMON_LISTENING port=' srv.log && break; sleep 0.5; done
          grep 'UAGMON_LISTENING port=' srv.log
          PORT="$(sed -n 's/.*UAGMON_LISTENING port=\([0-9]*\).*/\1/p' srv.log | head -1)"
          curl -fsS "http://127.0.0.1:${PORT}/api/meta" | grep '"ok":true'
          echo "✓ 동봉 앱에서 내장 서버 기동·응답 확인"

      - name: Generate sha256 sidecars
        run: |
          cd dist-mac
          for f in *.tar.gz; do shasum -a 256 "$f" > "$f.sha256"; done
          ls -la

      - name: Upload macOS app assets to rolling '${{ env.RELEASE_TAG }}' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" dist-mac/* --clobber
          echo "업로드 완료: $(ls dist-mac | tr '\n' ' ')"
