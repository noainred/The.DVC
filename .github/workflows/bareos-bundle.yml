name: bareos-bundle

# Bareos '완전 설치'(v2.844) 오프라인 번들 — rockylinux:9 컨테이너에서 Bareos(download.bareos.org/current/EL_9)·PostgreSQL·pyVmomi 8.x 휠을
# 의존 전체로 받아 묶고, 포탈 릴리스와 같은 서명 키(RELEASE_SIGNING_KEY)로 manifest 에 서명해 릴리스 태그 'bareos-bundle' 에 올린다.
# 포탈(중앙)은 설정 › Bareos › 완전 설치에서 이 태그의 bareos-bundle.json(포인터)을 읽고 서명·해시가 맞는 번들만 받는다.
#   - workflow_dispatch(main): 빌드 + 서명 + 게시(최근 3개 판만 남긴다)
#   - pull_request(이 파일·빌드 스크립트·서명 스크립트가 바뀔 때): 빌드 + 내용 목록 출력만(게시하지 않는다 — 의존 해석이 되는지 확인)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packaging/bareos-bundle/**'
      - 'scripts/bareos-bundle-sign.mjs'
      - 'server/src/bareos/install/bundleDoc.js'
      - '.github/workflows/bareos-bundle.yml'

permissions:
  contents: write

concurrency:
  group: bareos-bundle-${{ github.event_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.23.2'
  BUNDLE_TAG: bareos-bundle
  KEEP: '3'

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build bundle in rockylinux:9
        run: |
          mkdir -p dist-bareos
          docker run --rm -e RUN_NO="${{ github.run_number }}" -v "$PWD:/w" -w /w rockylinux:9 \
            bash packaging/bareos-bundle/build-bundle.sh /w/dist-bareos
          sudo chown -R "$(id -u):$(id -g)" dist-bareos
          ls -l dist-bareos

      - name: Show bundle contents
        id: ver
        run: |
          f=$(ls dist-bareos/bareos-bundle-*.json | head -1)
          v=$(basename "$f" .json); v=${v#bareos-bundle-}
          echo "version=$v" >> "$GITHUB_OUTPUT"
          node -e 'const d=require(process.argv[1]); console.log(JSON.stringify({version:d.version,bareos:d.bareosVersion,postgresql:d.postgresqlVersion,install:d.install,pyvmomi:d.pyvmomi.versions,vddk:d.vddk,packages:d.packages.length},null,1))' "$PWD/$f"

      - name: Sign (same key as portal releases)
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: node scripts/bareos-bundle-sign.mjs --version "${{ steps.ver.outputs.version }}" --dist dist-bareos

      - name: Publish to release '${{ env.BUNDLE_TAG }}'
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          v="${{ steps.ver.outputs.version }}"
          gh release view "$BUNDLE_TAG" >/dev/null 2>&1 \
            || gh release create "$BUNDLE_TAG" --title "Bareos offline bundle (portal full install)" --latest=false \
                 --notes "포탈 설정 › Bareos › 완전 설치가 쓰는 Rocky/RHEL 9 오프라인 번들. bareos-bundle.json 이 최신 판을 가리킵니다. 서명: 포탈 릴리스와 같은 키."
          # 본체 → 내용 목록 → manifest 를 먼저, 포인터는 마지막에(포인터가 아직 없는 판을 가리키지 않게)
          for f in "dist-bareos/bareos-bundle-$v.tar.gz" "dist-bareos/bareos-bundle-$v.json" "dist-bareos/bareos-bundle-$v.manifest.json"; do
            ok=0; for i in 1 2 3; do if gh release upload "$BUNDLE_TAG" "$f" --clobber; then ok=1; break; fi; sleep $((i*5)); done
            [ "$ok" = 1 ] || { echo "::error::업로드 실패: $f"; exit 1; }
          done
          gh release upload "$BUNDLE_TAG" dist-bareos/bareos-bundle.json --clobber
          # 오래된 판 정리(최근 $KEEP 개 판만)
          gh release view "$BUNDLE_TAG" --json assets -q '.assets[].name' > assets.txt
          grep -E '^bareos-bundle-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz$' assets.txt | sed -E 's/^bareos-bundle-(.*)\.tar\.gz$/\1/' | sort -t. -k1,1nr -k2,2nr -k3,3nr | tail -n +$((KEEP+1)) > old.txt || true
          while read -r ov; do
            [ -n "$ov" ] || continue
            for n in "bareos-bundle-$ov.tar.gz" "bareos-bundle-$ov.json" "bareos-bundle-$ov.manifest.json"; do gh release delete-asset "$BUNDLE_TAG" "$n" -y || true; done
          done < old.txt
          echo "게시: bareos-bundle-$v (정리: $(wc -l < old.txt)개 판)"
