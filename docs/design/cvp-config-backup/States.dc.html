<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>CVP 설정 백업 — 값이 없을 때의 문구</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="box-sizing: border-box; padding: clamp(12px, 2vw, 28px); background: #0a0e17; color: #e6edf6; font-family: 'Inter', 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; font-size: 13px; line-height: 1.5; display: flex; flex-direction: column; gap: 14px;">

<div style="display: flex; flex-direction: column; gap: 6px;">
<h1 style="margin: 0; font-size: 20px; font-weight: 700;">상태 — 값이 없을 때 화면이 하는 말</h1>
<div style="font-size: 12.5px; color: #a9b6cc; overflow-wrap: anywhere;">못 받은 것 · 비교할 수 없는 것은 ‘같음’ 에도 ‘다름’ 에도 넣지 않고 따로 셉니다. 이유를 아는 만큼만 말합니다.</div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px;">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="8">
<div style="background: #141b2d; border: 1px solid #1f2a40; border-radius: 14px; padding: 14px 16px; min-width: 0; display: flex; flex-direction: column; gap: 8px;">
<div style="display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center;">
<b style="font-size: 13.5px;">{{c.title}}</b>
<span style="{{c.pill}}">{{c.count}}</span>
</div>
<div style="font-size: 12px; color: #a9b6cc; overflow-wrap: anywhere;">{{c.where}}</div>
<div style="{{c.banner}}">{{c.text}}</div>
<div style="font-size: 12px; color: #a9b6cc; overflow-wrap: anywhere;">{{c.note}}</div>
</div>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":860}}'>
class Component extends DCLogic {
renderVals() {
const pill = 'display: inline-flex; align-items: center; min-height: 22px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; ';
const P = {
bad: pill + 'background: #5a1616; border: 1px solid #f87171; color: #ffe9e9;',
warn: pill + 'background: #4a3208; border: 1px solid #f59e0b; color: #fff3d6;',
info: pill + 'background: #172f5c; border: 1px solid #60a5fa; color: #e6f0ff;',
neu: pill + 'background: #1a2236; border: 1px solid #64748b; color: #cbd5e1;'
};
const box = 'padding: 10px 12px; border-radius: 10px; font-size: 12.5px; overflow-wrap: anywhere; ';
const B = {
bad: box + 'background: #2a1113; border: 1px solid #7f1d1d; color: #ffe9e9;',
warn: box + 'background: #2a1f0a; border: 1px solid #92400e; color: #fff3d6;',
info: box + 'background: #101a30; border: 1px solid #1e3a8a; color: #e6f0ff;',
neu: box + 'background: #0b1120; border: 1px solid #243049; color: #e6edf6;'
};
const c = (tone, title, count, where, text, note) => ({ title: title, count: count, pill: P[tone], where: where, banner: B[tone], text: text, note: note });
const cards = [
c('bad', '받지 못함', '따로 셈', '장비별 · 표의 ‘기준 대비’ 칸', '이 장비의 설정을 받지 못했습니다 — CVP 응답 시간 초과(3번 이어서). 마지막으로 받은 판은 11-23 02:12 입니다.', '마지막으로 받은 판은 계속 볼 수 있습니다. ‘같음’ 으로 쓰지 않습니다.'),
c('bad', '조회 경로 없음', 'CVP 단위', 'CVP 설정 › 수집 표 · 장비별 위쪽', '이 CVP 에서 설정을 읽는 경로를 찾지 못했습니다 — 후보 3개가 모두 실패했습니다(404 · 403 · 모르는 응답 모양).', 'CVP 판이 다르거나 계정 권한이 모자랄 수 있습니다. 어느 쪽인지는 응답 코드만 보여 주고 단정하지 않습니다.'),
c('warn', '수집이 멈춤', '법인 단위', '화면 맨 위 띠', '폴란드 1 법인 엣지가 3일째 설정 백업 결과를 올리지 않았습니다. 보이는 판은 11-23 것입니다.', '엣지는 받은 것이 0건이어도 상태를 올립니다. 그래서 ‘바뀐 것이 없음’ 과 ‘수집이 멈춤’ 을 가를 수 있습니다.'),
c('info', '첫 판', '비교 안 함', '장비별 · 직전 대비', '첫 판입니다 — 비교할 직전 판이 없습니다. 다음 판부터 바뀐 줄을 보여 줍니다.', '첫 판 전체를 ‘더해진 줄’ 로 세지 않습니다.'),
c('neu', '기준 없음', '따로 셈', '장비별 · 기준 대비', '기준으로 삼은 판이 없습니다. ‘지금 판을 기준으로 삼기’ 를 누르면 다음부터 기준과 비교합니다.', '기준은 장비마다 하나입니다. 기준을 바꾼 사람 · 시각 · 메모를 남깁니다.'),
c('warn', '비밀 줄을 비교할 수 없음', '바뀜으로 안 셈', '비교의 ~ 줄', '지문을 만드는 키가 바뀌어(11-20 엣지 재설치) 비밀 줄이 바뀌었는지 알 수 없습니다. 다음 판부터 다시 비교합니다.', '키가 바뀐 것을 ‘비밀 61대 바뀜’ 으로 잘못 알리지 않습니다.'),
c('info', '가림 규칙이 바뀐 뒤 첫 판', '바뀜으로 안 셈', '비교 · 변경 흐름', '가림 규칙이 바뀌어 이번 판부터 더 많은 줄이 가려집니다. 새로 가려진 줄 2개는 설정 변경으로 세지 않았습니다.', '예전 판은 다시 가릴 수 없습니다(원문이 없으므로). 그 사실을 판마다 표시합니다.'),
c('neu', '관리자 전용', '403', '탭 전체', '설정 백업은 관리자만 볼 수 있습니다.', '범위 계정 · 조회 계정에는 탭은 보이되 내용 대신 이 안내가 나옵니다(포탈 공용 권한 안내).')
];
return { cards: cards };
}
}
</script>
</body>
</html>
